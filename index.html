<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VOKAI</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* --- ESTÉTICA CORE (ZERO LATÊNCIA) --- */
        :root {
            --bg-color: #000000;
            --text-primary: #EAEAEA;
            --text-secondary: #888888;
            --accent: #FFFFFF;
            --border: #222222;
            --grid-gap: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 16px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita scroll na estrutura base */
        }

        /* CABEÇALHO KAIROS */
        header {
            margin-bottom: 24px;
            padding-top: 10px;
        }
        .kairos-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .kairos-greeting {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* GRID MODULAR (CONTAINER) */
        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: var(--grid-gap);
            flex-grow: 1;
            margin-bottom: 80px; /* Espaço para a dock */
        }

        .module-card {
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.1s;
            cursor: pointer;
        }

        .module-card:active {
            border-color: var(--text-secondary);
            background: #0a0a0a;
        }

        .card-icon { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-secondary); }
        .card-title { font-size: 0.9rem; font-weight: 500; }
        .card-status { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }

        /* MÓDULO GRANDE (SEGUNDO CÉREBRO) */
        .module-wide {
            grid-column: span 2;
        }

        /* DOCK DE CONTROLE (BARRA INFERIOR) */
        .control-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0;
            backdrop-filter: blur(10px); /* Opcional, remover se pesar */
            z-index: 100;
        }

        .dock-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 10px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .dock-btn.active { color: var(--accent); }

        /* BOTÃO VONTADE (V-KEY) */
        .v-key-container {
            position: relative;
            top: -20px;
        }
        .v-key {
            width: 56px;
            height: 56px;
            background: var(--text-primary);
            color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            border: 4px solid var(--bg-color); /* Cria recorte visual */
        }
        .v-key:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <header>
        <div class="kairos-time" id="kairos-display">INICIANDO SISTEMA...</div>
        <div class="kairos-greeting">Pronto para agir.</div>
    </header>

    <main class="module-grid">
        <div class="module-card module-wide" onclick="alert('Módulo Notas: Em breve')">
            <div class="card-icon">◇</div>
            <div>
                <div class="card-title">Córtex</div>
                <div class="card-status">0 Notas ativas</div>
            </div>
        </div>

        <div class="module-card" onclick="alert('Módulo Agenda: Em breve')">
            <div class="card-icon">◷</div>
            <div>
                <div class="card-title">Kairos</div>
                <div class="card-status">Sem eventos</div>
            </div>
        </div>

        <div class="module-card" onclick="alert('Módulo Hábitos: Em breve')">
            <div class="card-icon">◎</div>
            <div>
                <div class="card-title">Vontade</div>
                <div class="card-status">Rastrear</div>
            </div>
        </div>

        <div class="module-card module-wide" onclick="alert('Módulo IA: Em breve')">
            <div class="card-icon">◈</div>
            <div>
                <div class="card-title">Especialista</div>
                <div class="card-status">Offline</div>
            </div>
        </div>
    </main>

    <nav class="control-dock">
        <button class="dock-btn active">▦</button> <div class="v-key-container">
            <div class="v-key">V</div>
        </div>

        <button class="dock-btn">🔍</button> </nav>

    <script>
        // --- SCRIPT DO SISTEMA VOKAI CORE ---
        
        // 1. Atualizador do Relógio Kairos
        function updateKairos() {
            const now = new Date();
            const options = { weekday: 'long', hour: '2-digit', minute: '2-digit' };
            // Formata e coloca em maiúsculo
            document.getElementById('kairos-display').innerText = 
                now.toLocaleDateString('pt-BR', options).toUpperCase().replace('-FEIRA', '') + ' | AGORA';
        }
        
        setInterval(updateKairos, 1000);
        updateKairos();

        // 2. Registro do Service Worker (Para funcionar Offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('VOKAI SW registrado'))
                    .catch(err => console.log('Falha no SW:', err));
            });
        }
    </script>
</body>
</html>
