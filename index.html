<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOKAI OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body { 
            background-color: #050505; /* Obsidiana Pura */
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, .brand-font { font-family: 'Montserrat', sans-serif; }
        
        /* O Efeito Vidro VOKAI */
        .glass {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.15); /* Borda Ouro Sutíl */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Estado Ativo (Dourado Brilhante) */
        .glass-active {
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* Botão Principal */
        .btn-gold {
            background: linear-gradient(135deg, #b48811 0%, #D4AF37 100%);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Animações */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Input Customizado */
        .vokai-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            color: #D4AF37;
        }
        .vokai-input:focus {
            border-color: #D4AF37;
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* Markdown Styles */
        .prose strong { color: #D4AF37; }
        .prose h3 { color: #fff; margin-top: 10px; font-weight: bold; }
        .prose ul { list-style-type: disc; padding-left: 20px; color: #cbd5e1; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-yellow-500 selection:text-black">

    <header class="pt-6 pb-2 flex flex-col items-center justify-center z-10 fade-in">
        <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-2 drop-shadow-[0_0_10px_rgba(212,175,55,0.5)]">
            <path d="M20 20 L50 80 L80 20" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M80 20 L95 5" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
            <path d="M95 5 L85 5 M95 5 L95 15" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
            <rect x="44" y="35" width="12" height="12" transform="rotate(45 50 41)" fill="#D4AF37"/>
        </svg>
        <h1 class="text-2xl font-extrabold tracking-[0.2em] text-white">VOKAI</h1>
        <p id="system-status" class="text-[9px] text-yellow-600 font-mono mt-1 tracking-widest uppercase">Sistemas Online</p>
    </header>

    <main id="app-content" class="flex-grow p-5 overflow-y-auto pb-28 relative">
        
        <div id="view-home" class="fade-in space-y-6">
            <div class="text-center mb-8">
                <p class="text-slate-400 text-xs font-light">O que vamos conquistar hoje?</p>
                <h2 id="relogio" class="text-4xl font-light text-white mt-2 font-mono">00:00</h2>
            </div>

            <div class="glass p-5 rounded-2xl relative group">
                <div class="absolute -top-3 left-4 bg-black px-2 text-[10px] text-yellow-500 border border-yellow-900 rounded uppercase font-bold tracking-wider">Memória RAM</div>
                <textarea id="ram-input" class="w-full h-32 bg-transparent text-sm resize-none outline-none text-slate-300 placeholder-slate-700" placeholder="Esvazie sua mente aqui..."></textarea>
                <div class="flex justify-end mt-2 border-t border-white/5 pt-2">
                    <button onclick="copiarRAM()" class="text-xs text-yellow-600 hover:text-yellow-400 uppercase tracking-widest font-bold flex items-center gap-1">
                        <i data-lucide="copy" class="w-3 h-3"></i> Salvar
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="mudarAba('dex')" class="glass p-4 rounded-xl flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                    <i data-lucide="brain-circuit" class="w-6 h-6 text-cyan-500"></i>
                    <span class="text-xs font-bold text-slate-300">DEX</span>
                </button>
                <button onclick="mudarAba('settings')" class="glass p-4 rounded-xl flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                    <i data-lucide="settings" class="w-6 h-6 text-slate-500"></i>
                    <span class="text-xs font-bold text-slate-300">CONFIG</span>
                </button>
            </div>
        </div>

        <div id="view-dex" class="hidden fade-in space-y-4">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xl font-bold text-white tracking-wide">MÓDULO <span class="text-yellow-500">DEX</span></h2>
                <div class="text-[10px] bg-cyan-900/30 text-cyan-400 px-2 py-1 rounded border border-cyan-800">IA READY</div>
            </div>

            <div class="glass p-1 rounded-xl">
                <textarea id="dex-input" class="w-full h-40 bg-transparent p-4 text-sm text-white outline-none resize-none placeholder-slate-600" placeholder="Cole o conteúdo do SENAI ou livro aqui..."></textarea>
            </div>

            <button onclick="analisarConteudo()" id="btn-analisar" class="w-full btn-gold py-4 rounded-xl shadow-[0_0_20px_rgba(212,175,55,0.2)] active:scale-95 transition flex justify-center items-center gap-2">
                <i data-lucide="zap" class="w-4 h-4 text-black"></i> INICIAR ANÁLISE
            </button>

            <div id="ai-result" class="hidden glass p-5 rounded-xl border-l-2 border-yellow-500 prose prose-invert text-sm">
                </div>
        </div>

        <div id="view-settings" class="hidden fade-in space-y-6">
            <h2 class="text-xl font-bold text-white tracking-wide">SISTEMA</h2>
            
            <div class="space-y-2">
                <label class="text-xs text-yellow-600 uppercase font-bold">Chave de Acesso (API Key)</label>
                <input type="password" id="api-key" class="w-full vokai-input rounded-lg p-4 text-xs font-mono" placeholder="Cole sua Gemini API Key aqui">
            </div>
            
            <button onclick="salvarConfig()" class="w-full glass py-3 rounded-lg text-xs font-bold text-green-400 border-green-900/50 hover:bg-green-900/20">
                SALVAR CHAVE
            </button>
            
            <div class="pt-10 border-t border-white/5">
                <p class="text-[10px] text-center text-slate-600">VOKAI OS v1.2 // PROTOCOLO STARK</p>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-16 glass rounded-full flex justify-around items-center px-2 z-50">
        <button onclick="mudarAba('home')" id="nav-home" class="p-3 rounded-full text-yellow-500 transition hover:bg-white/5">
            <i data-lucide="home" class="w-5 h-5"></i>
        </button>
        <button onclick="mudarAba('dex')" id="nav-dex" class="p-3 rounded-full text-slate-500 transition hover:bg-white/5">
            <i data-lucide="book-open" class="w-5 h-5"></i>
        </button>
        <button onclick="mudarAba('settings')" id="nav-settings" class="p-3 rounded-full text-slate-500 transition hover:bg-white/5">
            <i data-lucide="sliders" class="w-5 h-5"></i>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        // --- SISTEMA CENTRAL ---
        const views = ['home', 'dex', 'settings'];
        
        function mudarAba(target) {
            views.forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                // Resetar ícones
                const navIcon = document.getElementById(`nav-${v}`);
                if(navIcon) navIcon.className = "p-3 rounded-full text-slate-500 transition hover:bg-white/5";
            });
            
            document.getElementById(`view-${target}`).classList.remove('hidden');
            // Ativar ícone
            const activeIcon = document.getElementById(`nav-${target}`);
            if(activeIcon) activeIcon.className = "p-3 rounded-full text-yellow-500 bg-white/5 shadow-[0_0_10px_rgba(212,175,55,0.2)] transition";
        }

        // --- RELÓGIO ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('relogio').innerText = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // --- MEMÓRIA E CONFIG ---
        const ramInput = document.getElementById('ram-input');
        const apiKeyInput = document.getElementById('api-key');

        // Carregar dados salvos
        window.onload = () => {
            ramInput.value = localStorage.getItem('vokai_ram') || '';
            apiKeyInput.value = localStorage.getItem('vokai_apikey') || '';
            mudarAba('home'); // Inicia na Home
        };

        // Auto-save RAM
        ramInput.addEventListener('input', () => localStorage.setItem('vokai_ram', ramInput.value));

        function salvarConfig() {
            localStorage.setItem('vokai_apikey', apiKeyInput.value);
            alert("SISTEMA: Chave de segurança atualizada.");
            mudarAba('home');
        }

        function copiarRAM() {
            navigator.clipboard.writeText(ramInput.value);
            const btn = document.querySelector('button[onclick="copiarRAM()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> Copiado`;
            setTimeout(() => btn.innerHTML = originalText, 2000);
        }

        // --- INTELIGÊNCIA ARTIFICIAL (GEMINI) ---
        async function analisarConteudo() {
            const texto = document.getElementById('dex-input').value;
            const apiKey = localStorage.getItem('vokai_apikey');
            const outputDiv = document.getElementById('ai-result');
            const btn = document.getElementById('btn-analisar');

            if (!texto) return alert("ERRO: Insira dados para análise.");
            if (!apiKey) return alert("ERRO: Protocolo de segurança falhou. Configure a API Key.");

            // Feedback visual de carregamento
            outputDiv.classList.remove('hidden');
            outputDiv.innerHTML = `<div class="animate-pulse text-yellow-500">Processando lógica Bruce Lee...</div>`;
            btn.disabled = true;
            btn.innerHTML = "ANALISANDO...";

            // O Prompt "Bruce Lee"
            const systemPrompt = `
                Você é o VOKAI, um sistema de inteligência focado em eficácia e evolução pessoal.
                Filosofia: Bruce Lee (Jeet Kune Do). Absorva o que é útil, descarte o que é inútil.
                
                MISSÃO: Analise o texto fornecido pelo usuário (estudos/técnico).
                1. Identifique o conceito central (A essência).
                2. Liste 3 pontos práticos que podem ser aplicados na vida real ou profissional.
                3. Identifique o que é "ruído" ou teoria desnecessária e avise para ignorar.
                
                Formate a resposta em Markdown, use negrito para destaque. Seja direto, curto e letal.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: systemPrompt + "\n\nTEXTO PARA ANÁLISE:\n" + texto }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const mdText = data.candidates[0].content.parts[0].text;
                    outputDiv.innerHTML = marked.parse(mdText); // Converte Markdown para HTML bonito
                } else {
                    outputDiv.innerHTML = "<span class='text-red-500'>Falha na conexão neural. Verifique a API Key.</span>";
                }

            } catch (error) {
                outputDiv.innerHTML = `<span class='text-red-500'>Erro crítico: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-black"></i> INICIAR ANÁLISE`;
            }
        }
    </script>
</body>
    </html>
